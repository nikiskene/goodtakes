name: Apple Silicon desktop package
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: rustup show
      - run: brew install cmake pkgconf libass zimg
      - run: npm ci
      - run: bash scripts/package-macos.sh
        env:
          VITE_SUPABASE_URL: https://tsxgcjhcyckgbrkvebfq.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: GoodTake-Apple-Silicon-unsigned
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
